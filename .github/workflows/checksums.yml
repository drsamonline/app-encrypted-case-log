# Attach SHA256SUMS.txt to every published release.
#
# The build workflow (app-builder) owns the assets: the portable EXE, the APK and the
# Linux binary. This job only reads them and adds a checksum file beside them, so a
# download can be verified offline — which matters for an app that refuses to make
# network requests at runtime.
#
# Uploading an asset does not fire `release: published` again, so this cannot loop.

name: checksums

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to checksum
        required: true

permissions:
  contents: write

jobs:
  sums:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --clobber
          rm -f dl/SHA256SUMS.txt

      - name: Write and show SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dl
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dl/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
