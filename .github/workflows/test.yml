name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # was @v7.1.0
        with:
          node-version: "20"
      - name: Run the suite
        run: node tests/self-tests.js
